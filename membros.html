        // Lógica de Renderização com Linhas Visíveis
        function formatNerve(text) {
            return text.replace(/(Nervo [a-zA-Záéíóúâêôãõç ]+|N\. [a-zA-Záéíóúâêôãõç ]+)/g, '<span class="nerve-tag">$1</span>');
        }

        function renderTable(category) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            const filteredData = anatomyData.filter(item => item.category === category);

            filteredData.forEach(muscle => {
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td class="p-4 col-musculo">${muscle.name}</td>
                    <td class="p-4 col-proximal leading-relaxed">${muscle.insercaoProximal}</td>
                    <td class="p-4 col-distal leading-relaxed">${muscle.insercaoDistal}</td>
                    <td class="p-4">${formatNerve(muscle.innervation)}</td>
                    <td class="p-4 col-acao">${muscle.action}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function changeTab(tabName) {
            document.querySelectorAll('.nav-btn, .nav-btn-prova').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${tabName}`).classList.add('active');

            if (tabName === 'PROVA') {
                document.getElementById('table-container').classList.add('hidden');
                document.getElementById('quiz-container').classList.remove('hidden');
                document.getElementById('quiz-container').classList.add('flex');
                startQuiz();
            } else {
                document.getElementById('quiz-container').classList.add('hidden');
                document.getElementById('quiz-container').classList.remove('flex');
                document.getElementById('table-container').classList.remove('hidden');
                renderTable(tabName);
            }
        }

        let currentQuestion = 0;
        let score = 0;

        function startQuiz() {
            currentQuestion = 0;
            score = 0;
            updateScore();
            showQuestion();
        }

        function showQuestion() {
            const q = quizData[currentQuestion];
            
            document.getElementById('question-number').innerText = `Questão ${currentQuestion + 1} de ${quizData.length}`;
            document.getElementById('question-context').innerHTML = `<strong>Contexto:</strong> ${q.context}<br><br><strong>Pergunta:</strong> ${q.question}`;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            document.getElementById('feedback-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            const letters = ['A', 'B', 'C', 'D', 'E'];

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option w-full text-left p-4 rounded-xl text-slate-700 text-sm md:text-base flex gap-4 items-start shadow-sm';
                btn.innerHTML = `<span class="font-bold text-slate-400 mt-0.5">${letters[index]}.</span> <span>${opt}</span>`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            const buttons = document.getElementById('options-container').querySelectorAll('button');
            buttons.forEach(b => {
                b.disabled = true;
                b.style.cursor = 'default';
            });

            const correctIndex = quizData[currentQuestion].answer;
            const feedbackBox = document.getElementById('feedback-box');
            
            feedbackBox.classList.remove('hidden');

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                feedbackBox.className = 'p-5 rounded-xl text-sm md:text-base font-medium border bg-emerald-50 border-emerald-200 text-emerald-800 mt-4 shadow-sm';
                feedbackBox.innerText = 'Alternativa Correta! Excelente raciocínio clínico-anatômico.';
                score++;
            } else {
                btnElement.classList.add('incorrect');
                buttons[correctIndex].classList.add('correct');
                feedbackBox.className = 'p-5 rounded-xl text-sm md:text-base font-medium border bg-rose-50 border-rose-200 text-rose-800 mt-4 shadow-sm';
                const letters = ['A', 'B', 'C', 'D', 'E'];
                feedbackBox.innerText = `Alternativa Incorreta. A resposta certa era a letra ${letters[correctIndex]}.`;
            }

            updateScore();
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.classList.remove('hidden');
            nextBtn.innerText = currentQuestion < quizData.length - 1 ? 'Avançar para a próxima' : 'Finalizar Prova';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                showQuestion();
            } else {
                const percentage = (score / quizData.length) * 100;
                let message = percentage >= 70 ? "Desempenho excelente! Você possui grande domínio da anatomia do membro inferior." : "Bom esforço, mas há espaço para revisão da anatomia funcional e clínica.";
                
                document.getElementById('question-box').innerHTML = `
                    <div class="text-center py-12">
                        <h3 class="text-3xl font-bold text-slate-900 mb-4">Prova Concluída</h3>
                        <p class="text-xl text-slate-600 mb-2">Acertos: <span class="text-rose-600 font-bold">${score}</span> de ${quizData.length} (${percentage.toFixed(1)}%)</p>
                        <p class="text-slate-500 mb-8">${message}</p>
                        <button onclick="startQuiz()" class="px-8 py-3 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-xl transition-colors shadow-sm">
                            Refazer o Simulado
                        </button>
                    </div>
                `;
                document.getElementById('feedback-box').classList.add('hidden');
                document.getElementById('next-btn').classList.add('hidden');
                document.getElementById('question-number').classList.add('hidden');
            }
        }

        function updateScore() {
            document.getElementById('quiz-score').innerText = `${score}/${quizData.length}`;
        }

        window.onload = () => changeTab('GLÚTEO');
    </script>
